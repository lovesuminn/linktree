<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sumin Jo | Research Links</title>
  <meta name="description" content="LBCLAB, AMLaP 2026 Abstract, AMLaP 2026 Poster, List of Sticker Stimuli, CV, Contact Email" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f7f5;
      --card:#ffffff;
      --line:#e4e4e0;
      --ink:#161615;
      --ink-soft:#78766f;
      --btn:#f2f1ed;
      --label:#a6a49b;
      --accent:#161615;
    }
    *{ box-sizing:border-box; }
    body {
      font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 380px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      padding: 40px 28px 32px;
      border-radius: 20px;
      text-align: center;
    }
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 18px;
      border: 1px solid var(--line);
    }
    h1 {
      font-family:'Inter', sans-serif;
      font-weight: 600;
      margin: 0;
      font-size: 24px;
      color: var(--ink);
      letter-spacing: -0.2px;
    }
    p.role {
      font-size: 13.5px;
      color: var(--ink-soft);
      margin: 8px 0 22px;
      line-height: 1.55;
      word-break: keep-all;
      word-wrap: break-word;
    }
    .banner{
      background:var(--ink);
      color:#ffffff;
      text-align:center;
      font-size:13px;
      letter-spacing:0.2px;
      padding:13px 14px;
      border-radius:10px;
      margin-bottom:26px;
    }
    .banner b{ font-weight:700; }
    .section-label{
      font-size:11px;
      color:var(--label);
      font-weight:600;
      letter-spacing:0.3px;
      margin:0 2px 10px;
      text-align:left;
    }
    .group{ margin-bottom:22px; }
    .group:last-child{ margin-bottom:0; }
    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .link {
      display: block;
      padding: 13px 16px;
      background: var(--btn);
      border-radius: 10px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 500;
      font-size: 14.5px;
      border: 1px solid transparent;
      transition: transform 0.15s ease;
    }
    .link:active { transform: scale(0.98); }
    .link.cv {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    .link.contact {
      background: transparent;
      border: 1px solid var(--line);
    }
    @media (max-width: 400px) {
      h1 { font-size: 22px; }
      p.role { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="sumin.png" alt="Sumin Jo" class="profile-img">
    <h1>Sumin Jo</h1>
    <p class="role">
      Department of German Language and Literature<br>
      Hanyang University (Ph.D. Applicant)
    </p>

    <div class="banner">Currently applying for a <b>Doctoral position</b>, 2027</div>

    <div class="group">
      <p class="section-label">RESEARCH</p>
      <div class="links">
        <a class="link" href="https://lbclab.hanyang.ac.kr/" target="_blank" rel="noopener noreferrer">LBCLAB</a>
        <a class="link" href="amlap2026-abstract.pdf" target="_blank" rel="noopener noreferrer">AMLaP 2026 Abstract</a>
        <a class="link" href="amlap2026-poster.pdf" target="_blank" rel="noopener noreferrer">AMLaP 2026 Poster</a>
        <a class="link" href="sticker-stimuli.pdf" target="_blank" rel="noopener noreferrer">List of Sticker Stimuli</a>
      </div>
    </div>

    <div class="group">
      <p class="section-label">APPLY</p>
      <div class="links">
        <a class="link cv" href="cv.pdf" target="_blank" rel="noopener noreferrer">CV / Resume (PDF)</a>
      </div>
    </div>

    <div class="group">
      <p class="section-label">CONTACT</p>
      <div class="links">
        <a class="link contact" href="https://mail.google.com/mail/?view=cm&fs=1&to=lovesuminn@hanyang.ac.kr" target="_blank" rel="noopener noreferrer">Contact Email</a>
      </div>
    </div>
  </div>
</body>
</html>
